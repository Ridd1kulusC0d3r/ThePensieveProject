name: EVTX integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-evtx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[evtx]'
      - name: Download public EVTX fixture
        run: curl -fL --retry 3 -o sample.evtx https://raw.githubusercontent.com/sbousseaden/EVTX-ATTACK-SAMPLES/master/UACME_59_Sysmon.evtx
      - run: pensieve-timeline ingest sample.evtx -o timeline.jsonl
      - name: Assert canonical events
        shell: python
        run: |
          import json
          from pathlib import Path
          rows=[json.loads(line) for line in Path("timeline.jsonl").read_text().splitlines() if line.strip()]
          assert rows, "EVTX parser emitted zero events"
          assert all(row["artifact_type"]=="evtx" for row in rows)
          assert all(row["event_id"] for row in rows)
          print(f"validated {len(rows)} EVTX events")
