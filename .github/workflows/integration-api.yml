name: Read-only API integration

on:
  pull_request:
    paths:
      - "src/pensieve_timeline/api.py"
      - "src/pensieve_timeline/storage.py"
      - "tests/test_api_optional.py"
      - "pyproject.toml"
      - ".github/workflows/integration-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ".[api]"
      - run: python -m unittest tests.test_api_optional -v
      - name: Verify API is optional
        run: |
          python -m pip uninstall -y fastapi starlette uvicorn || true
          python -c "import pensieve_timeline; print(pensieve_timeline.__version__)"
